name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest Python on Linux (dash as sh, GNU sed).
          - os: ubuntu-latest
            python: python3
            setup: "3.x"
          # The python3 shipped with macOS (3.9), which runs the hooks for many
          # users, with BSD sed. setup-python no longer builds 3.9 for recent
          # Ubuntu runners, so it is tested where it actually lives.
          - os: macos-latest
            python: /usr/bin/python3
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned by commit SHA, tag in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.setup
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.setup }}
      - name: Python version
        run: ${{ matrix.python }} --version
      - name: Repository consistency
        run: ${{ matrix.python }} scripts/validate.py
      - name: Typography
        run: ${{ matrix.python }} scripts/typo-lint.py .
      - name: Tests
        run: ${{ matrix.python }} -m unittest discover -s tests
